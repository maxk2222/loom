name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, arch: linux-x86_64, zig: true, zigtarget: "x86_64-unknown-linux-gnu.2.31" }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, arch: linux-aarch64, zig: true, zigtarget: "aarch64-unknown-linux-gnu.2.31" }
          - { os: macos-latest,   target: aarch64-apple-darwin,    arch: macos-aarch64, cfeatures: "tray" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,  arch: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend (embedded assets)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run build:client

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install zig (aarch64 cross toolchain)
        if: ${{ matrix.zig }}
        run: pip install ziglang
      - name: Install cargo-zigbuild
        if: ${{ matrix.zig }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build binaries
        run: |
          FEAT=""; [ -n "${{ matrix.cfeatures }}" ] && FEAT="--features ${{ matrix.cfeatures }}"
          if [ "${{ matrix.zig }}" = "true" ]; then
            # zigbuild with pinned glibc floor — ubuntu-latest links 2.39
            # symbols that warn/fail on older distros (bookworm=2.36).
            cargo zigbuild --release -p loom-server -p loom-client -p loom-cli --target ${{ matrix.zigtarget }} $FEAT
          else
            cargo build --release -p loom-server -p loom-client -p loom-cli --target ${{ matrix.target }} $FEAT
          fi
        shell: bash

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          out="out"; mkdir -p "$out"
          # zigbuild strips the glibc suffix — artifacts land under the base triple.
          bin="target/${{ matrix.target }}/release"
          ext=""; case "${{ matrix.arch }}" in windows-*) ext=".exe";; esac
          for kind in server client; do
            name="loom-${kind}-${ver}-${{ matrix.arch }}"
            cp "${bin}/loom-${kind}${ext}" "${out}/${name}"
            chmod +x "${out}/${name}" 2>/dev/null || true
            (cd "$out" && sha256sum "${name}" | awk '{print $1}' > "${name}.sha256")
          done
          # The loom CLI ships too — install-client.sh expects it next to the
          # client binary (and admins want it on workstations).
          cli="loom-${ver}-${{ matrix.arch }}"
          cp "${bin}/loom${ext}" "${out}/${cli}"
          chmod +x "${out}/${cli}" 2>/dev/null || true
          (cd "$out" && sha256sum "${cli}" | awk '{print $1}' > "${cli}.sha256")
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: out/*

  sign-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: rel
          merge-multiple: true

      - name: Install minisign
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/minisign.tgz https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          tar -xzf /tmp/minisign.tgz -C /tmp
          sudo install -m755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
          minisign -v

      - name: Sign artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::warning::MINISIGN_SECRET_KEY not set — artifacts unsigned, updater will refuse them"
            exit 0
          fi
          printf '%s' "${MINISIGN_SECRET_KEY}" > /tmp/loom-release.key
          chmod 600 /tmp/loom-release.key
          for f in rel/loom-*; do
            case "$f" in *.sha256|*.minisig) continue;; esac
            minisign -Sm "$f" -s /tmp/loom-release.key -W # emits ${f}.minisig
          done
          ls rel/ | head -30

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: rel/*

  # GHCR images built FROM the signed release binaries — the image binary is
  # bit-identical to the downloadable asset and the self-update payload, so
  # no delivery path can drift. Multi-arch via buildx/QEMU (apt + COPY only).
  docker-image:
    needs: sign-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version tags
        id: meta
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "minor=${ver%.*}" >> "$GITHUB_OUTPUT"

      - name: Fetch + verify signed release binaries
        run: |
          set -euo pipefail
          ver="${{ steps.meta.outputs.ver }}"
          repo="${{ github.repository }}"
          for kind in server client; do
            for pair in "amd64 linux-x86_64" "arm64 linux-aarch64"; do
              set -- $pair; darch="$1"; aarch="$2"
              name="loom-${kind}-${ver}-${aarch}"
              dest="out/${kind}/${darch}/loom-${kind}"
              mkdir -p "$(dirname "$dest")"
              curl -fsSL -o "$dest" \
                "https://github.com/${repo}/releases/download/${GITHUB_REF_NAME}/${name}"
              want="$(curl -fsSL \
                "https://github.com/${repo}/releases/download/${GITHUB_REF_NAME}/${name}.sha256")"
              got="$(sha256sum "$dest" | awk '{print $1}')"
              [ "$got" = "$want" ] || { echo "sha256 mismatch: ${name}" >&2; exit 1; }
              chmod +x "$dest"
            done
          done
          find out -type f -exec ls -l {} +

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.release-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/loom-server:${{ steps.meta.outputs.ver }}
            ghcr.io/${{ github.repository_owner }}/loom-server:${{ steps.meta.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/loom-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.ver }}

      - name: Build + push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.release-client
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/loom-client:${{ steps.meta.outputs.ver }}
            ghcr.io/${{ github.repository_owner }}/loom-client:${{ steps.meta.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/loom-client:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.ver }}
