name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, arch: linux-x86_64, zig: true, zigtarget: "x86_64-unknown-linux-gnu.2.31" }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, arch: linux-aarch64, zig: true, zigtarget: "aarch64-unknown-linux-gnu.2.31" }
          - { os: macos-latest,   target: aarch64-apple-darwin,    arch: macos-aarch64, cfeatures: "tray" }
          - { os: macos-15-intel, target: x86_64-apple-darwin,     arch: macos-x86_64, cfeatures: "tray" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,  arch: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend (embedded assets)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run build:client

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install zig (aarch64 cross toolchain)
        if: ${{ matrix.zig }}
        run: pip install ziglang
      - name: Install cargo-zigbuild
        if: ${{ matrix.zig }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build binaries
        run: |
          FEAT=""; [ -n "${{ matrix.cfeatures }}" ] && FEAT="--features ${{ matrix.cfeatures }}"
          if [ "${{ matrix.zig }}" = "true" ]; then
            # zigbuild with pinned glibc floor — ubuntu-latest links 2.39
            # symbols that warn/fail on older distros (bookworm=2.36).
            cargo zigbuild --release -p loom-server -p loom-client --target ${{ matrix.zigtarget }} $FEAT
          else
            cargo build --release -p loom-server -p loom-client --target ${{ matrix.target }} $FEAT
          fi
        shell: bash

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          out="out"; mkdir -p "$out"
          bin="target/${{ matrix.zigtarget || matrix.target }}/release"
          ext=""; case "${{ matrix.arch }}" in windows-*) ext=".exe";; esac
          for kind in server client; do
            name="loom-${kind}-${ver}-${{ matrix.arch }}"
            cp "${bin}/loom-${kind}${ext}" "${out}/${name}"
            chmod +x "${out}/${name}" 2>/dev/null || true
            (cd "$out" && sha256sum "${name}" | awk '{print $1}' > "${name}.sha256")
          done
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: out/*

  sign-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: rel
          merge-multiple: true

      - name: Install minisign
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/minisign.tgz https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          tar -xzf /tmp/minisign.tgz -C /tmp
          sudo install -m755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
          minisign -v

      - name: Sign artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::warning::MINISIGN_SECRET_KEY not set — artifacts unsigned, updater will refuse them"
            exit 0
          fi
          printf '%s' "${MINISIGN_SECRET_KEY}" > /tmp/loom-release.key
          chmod 600 /tmp/loom-release.key
          for f in rel/loom-*; do
            case "$f" in *.sha256|*.minisig) continue;; esac
            minisign -Sm "$f" -s /tmp/loom-release.key -W # emits ${f}.minisig
          done
          ls rel/ | head -30

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: rel/*
