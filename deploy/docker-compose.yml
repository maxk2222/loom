# LOOM — deployment stack.
# Dev: docker compose up -d postgres redis
# Prod: docker compose --profile full up -d

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loom}
      POSTGRES_DB: ${POSTGRES_DB:-loom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy noeviction
      --appendonly no
      --save ''
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LOOM_DATABASE_URL: postgres://${POSTGRES_USER:-loom}:${POSTGRES_PASSWORD:-loom}@postgres:5432/${POSTGRES_DB:-loom}
      LOOM_REDIS_URL: redis://default:${REDIS_PASSWORD:-}@redis:6379/0
      LOOM_REDIS_PREFIX: "${LOOM_REDIS_PREFIX:-loom:prod:}"
      LOOM_HTTP_BIND: "0.0.0.0:${LOOM_HTTP_PORT:-8080}"
      LOOM_GRPC_BIND: "0.0.0.0:${LOOM_GRPC_PORT:-50051}"
      # TLS/mTLS + bootstrap listener (internal CA, cert issuance without
      # client cert — also the Cloudflare tunnel gRPC origin:
      # grpc.<domain> -> https://server:50053, noTLSVerify + http2Origin).
      LOOM_GRPC_TLS_CERT: "${LOOM_GRPC_TLS_CERT:-}"
      LOOM_GRPC_TLS_KEY: "${LOOM_GRPC_TLS_KEY:-}"
      LOOM_GRPC_TLS_CLIENT_CA: "${LOOM_GRPC_TLS_CLIENT_CA:-}"
      LOOM_MTLS: "${LOOM_MTLS:-}"
      LOOM_GRPC_BOOTSTRAP_BIND: "${LOOM_GRPC_BOOTSTRAP_BIND:-}"
      # Plaintext h2c agent listener — for a future h2c-capable
      # cloudflared; never map it to a host port.
      LOOM_GRPC_PLAIN_BIND: "${LOOM_GRPC_PLAIN_BIND:-}"
      LOOM_DATA_DIR: /data
      LOOM_TRUST_PROXY: "${LOOM_TRUST_PROXY:-0}"
      RUST_LOG: "${RUST_LOG:-info,loom_server=debug}"
    volumes:
      - serverdata:/data
    ports:
      - "${LOOM_GRPC_ADDR:-127.0.0.1}:${LOOM_GRPC_PORT:-50051}:${LOOM_GRPC_PORT:-50051}"
      - "${LOOM_HTTP_ADDR:-127.0.0.1}:${LOOM_HTTP_PORT:-8080}:${LOOM_HTTP_PORT:-8080}"

  # Optional Cloudflare Tunnel ingress (instead of caddy for external exposure).
  # Set CF_TUNNEL_TOKEN + LOOM_TRUST_PROXY=1 in .env, then:
  #   docker compose --profile tunnel up -d
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # "auto" prefers QUIC (streams gRPC/WebSocket request bodies live);
    # "http2" buffers request bodies until the stream ends — bidirectional
    # gRPC through the tunnel can never complete a Hello that way. QUIC
    # needs outbound UDP/7844; without it cloudflared falls back to http2.
    command: tunnel --no-autoupdate --protocol auto run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    depends_on:
      server:
        condition: service_started

  caddy:
    profiles: ["full"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  redisdata:
  serverdata:
  caddydata:
  caddyconfig:
