[package]
name = "loom-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
loom-core.workspace = true
loom-protocol.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
futures = "0.3"
futures-util.workspace = true
async-trait.workspace = true
pin-project-lite.workspace = true
async-stream.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
reqwest.workspace = true
multer.workspace = true
eventsource-stream.workspace = true
tonic.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true
chrono.workspace = true
semver.workspace = true
bytes.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
argon2.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
thiserror.workspace = true
anyhow.workspace = true
rust-embed.workspace = true
rustls.workspace = true
url.workspace = true
clap.workspace = true
minisign-verify.workspace = true
http = "1"

tray-icon = { version = "0.26", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
sysinfo = "0.33"

[target."cfg(target_os = \"macos\")".dependencies]
core-foundation = { version = "0.10", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, features = ["std", "objc2-core-foundation", "NSApplication", "NSRunningApplication"] }

[features]
default = []
tray = ["dep:tray-icon", "dep:image", "dep:core-foundation", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]

[dev-dependencies]
loom-testkit.workspace = true

[[bin]]
name = "loom-client"
path = "src/main.rs"
