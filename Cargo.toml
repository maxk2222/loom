[workspace]
resolver = "2"
members = [
    "crates/loom-core",
    "crates/loom-protocol",
    "crates/loom-server",
    "crates/loom-client",
    "crates/loom-cli",
    "crates/loom-testkit",
]

[workspace.package]
version = "0.8.5"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/loom-llm/loom"
rust-version = "1.80"

[workspace.dependencies]
# internal
loom-core = { path = "crates/loom-core" }
loom-protocol = { path = "crates/loom-protocol" }
loom-testkit = { path = "crates/loom-testkit" }
loom-client = { path = "crates/loom-client" }
loom-server = { path = "crates/loom-server" }

# async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"
async-stream = "0.3"

# http
axum = { version = "0.8", features = ["multipart", "macros"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "fs", "timeout"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart"], default-features = false }
multer = "3"
eventsource-stream = "0.2"

# grpc
tonic = { version = "0.12", features = ["transport", "tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3"

# persistence
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros",
] }
redis = { version = "0.27", features = ["tokio-comp", "script", "connection-manager", "streams", "geospatial"] }

# serde / config
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
bytes = "1"

# crypto / auth
argon2 = "0.5"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
minisign-verify = "0.2"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = { version = "0.27", features = ["trace"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
metrics-util = "0.19"

# misc
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rust-embed = { version = "8", features = ["include-exclude"] }
rustls = "0.23"
rcgen = { version = "0.13", features = ["x509-parser"] }
time = "0.3"
url = "2"
async-once-cell = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
